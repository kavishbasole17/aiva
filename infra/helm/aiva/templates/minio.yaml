{{- if .Values.minio.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "aiva.fullname" . }}-minio
  labels:
    {{- include "aiva.componentLabels" (dict "component" "minio" "Release" .Release) | nindent 4 }}
spec:
  serviceName: {{ include "aiva.fullname" . }}-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: minio
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "aiva.componentLabels" (dict "component" "minio" "Release" .Release) | nindent 8 }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "aiva.fullname" . }}-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "aiva.fullname" . }}-secrets
                  key: MINIO_SECRET_KEY
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.minio.storageSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiva.fullname" . }}-minio
  labels:
    {{- include "aiva.componentLabels" (dict "component" "minio" "Release" .Release) | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/component: minio
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: api
      port: 9000
    - name: console
      port: 9001
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aiva.fullname" . }}-minio-init
  labels:
    {{- include "aiva.componentLabels" (dict "component" "minio-init" "Release" .Release) | nindent 4 }}
  annotations:
    # Re-run on every `helm upgrade`, mirroring compose.yaml's minio-init
    # one-shot container semantics (idempotent: mc mb --ignore-existing).
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: minio-init
          image: minio/mc:RELEASE.2024-10-29T15-34-59Z
          envFrom:
            - secretRef:
                name: {{ include "aiva.fullname" . }}-secrets
          command:
            - /bin/sh
            - -c
            - |
              mc alias set local http://{{ include "aiva.fullname" . }}-minio:9000 "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY" &&
              mc mb --ignore-existing local/aiva-artifacts
{{- end }}
