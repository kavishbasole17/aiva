{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aiva.fullname" . }}-postgres-initdb
  labels:
    {{- include "aiva.componentLabels" (dict "component" "postgres" "Release" .Release) | nindent 4 }}
data:
  # Mirrors infra/postgres/initdb/01_extensions.sql exactly (same file
  # compose.yaml mounts) -- including its known gap: the aiva_app role's
  # password is a fixed dev-only literal, not parameterized by this chart's
  # secrets.postgresAppPassword value. A real production deployment should
  # replace this ConfigMap's content with a version reading the password
  # from an environment variable the init script can see, before relying on
  # it -- not assumed fixed here.
  01_extensions.sql: |
{{ .Files.Get "postgres-initdb/01_extensions.sql" | indent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "aiva.fullname" . }}-postgres
  labels:
    {{- include "aiva.componentLabels" (dict "component" "postgres" "Release" .Release) | nindent 4 }}
spec:
  serviceName: {{ include "aiva.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "aiva.componentLabels" (dict "component" "postgres" "Release" .Release) | nindent 8 }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: aiva
            - name: POSTGRES_DB
              value: aiva
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "aiva.fullname" . }}-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "aiva", "-d", "aiva"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: initdb
          configMap:
            name: {{ include "aiva.fullname" . }}-postgres-initdb
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storageSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiva.fullname" . }}-postgres
  labels:
    {{- include "aiva.componentLabels" (dict "component" "postgres" "Release" .Release) | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/component: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 5432
{{- end }}
