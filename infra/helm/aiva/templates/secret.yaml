# Placeholder Secret so `helm template`/`helm install` succeeds with no
# extra setup. Real deployments MUST override every value here via a
# separate values file that is never committed, --set-file, or (preferred)
# an external-secrets-operator ExternalSecret pointing at the org's real
# Vault/KMS -- same "no secrets in the repo" rule ADR-005 applies to
# compose.yaml, unchanged for this chart.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aiva.fullname" . }}-secrets
  labels:
    {{- include "aiva.labels" . | nindent 4 }}
type: Opaque
stringData:
  AIVA_JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  AIVA_ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  AIVA_GATEWAY_ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  POSTGRES_APP_PASSWORD: {{ .Values.secrets.postgresAppPassword | quote }}
  MINIO_ACCESS_KEY: {{ .Values.secrets.minioAccessKey | quote }}
  MINIO_SECRET_KEY: {{ .Values.secrets.minioSecretKey | quote }}
  EMAIL_SMTP_USERNAME: {{ .Values.secrets.emailSmtpUsername | quote }}
  EMAIL_SMTP_PASSWORD: {{ .Values.secrets.emailSmtpPassword | quote }}
