[project]
name = "aiva-api"
version = "0.1.0"
description = "AIVA air-gapped recruitment platform API"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "email-validator>=2.2,<3",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic-settings>=2.6,<3",
    "structlog>=24.4,<25",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "redis>=5.2,<6",
    "minio>=7.2,<8",
    "urllib3>=2.2,<3",
    "httpx>=0.27,<0.28",
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<24",
    "pymupdf>=1.24,<2",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.17,<0.1",
    "pyjwt>=2.9,<3",
    "pyotp>=2.9,<3",
    "pgvector>=0.3,<0.4",
    "reportlab>=4.2,<5",
    "openpyxl>=3.1,<4",
    # scheduling.py's ZoneInfo() lookups need an IANA tz database on disk;
    # python:3.11-slim (the Dockerfile's base image) doesn't ship one at the
    # OS level, so this must be a real dependency, not a dev-only convenience
    # (same "works on the CI host, breaks in the real container" class of
    # gap already caught once for python-multipart/httpx above).
    "tzdata>=2024.2",
    "cryptography>=43,<44",
    "slowapi>=0.1.9,<0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "httpx>=0.27,<0.28",
    "asgi-lifespan>=2.1,<3",
    "ruff>=0.7,<0.8",
    "black>=24.10,<25",
    "mypy>=1.13,<1.14",
    "bandit>=1.8,<2",
    "types-openpyxl>=3.1,<4",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.flake8-bugbear]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"alembic/versions/*" = ["E501", "S608"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["minio.*", "pgvector.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", "alembic"]
