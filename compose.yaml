name: aiva

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aiva
      POSTGRES_PASSWORD: aiva_dev_only
      POSTGRES_DB: aiva
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiva -d aiva"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: aiva_dev
      MINIO_ROOT_PASSWORD: aiva_dev_only_change_me
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:RELEASE.2024-10-29T15-34-59Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 aiva_dev aiva_dev_only_change_me &&
      mc mb --ignore-existing local/aiva-artifacts"

  ai-gateway:
    build:
      context: ./services/ai-gateway
    environment:
      # Defaults to the deterministic mock backend so `docker compose up` works
      # with zero setup (CI, first clone, no API key). Set ANTHROPIC_API_KEY and
      # AIVA_GATEWAY_LLM_BACKEND=anthropic in a local .env to enable real inference —
      # see .env.example. Same opt-in pattern for embeddings.
      AIVA_GATEWAY_LLM_BACKEND: ${AIVA_GATEWAY_LLM_BACKEND:-mock}
      AIVA_GATEWAY_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AIVA_GATEWAY_ANTHROPIC_MODEL: ${AIVA_GATEWAY_ANTHROPIC_MODEL:-claude-sonnet-5}
      AIVA_GATEWAY_STT_BACKEND: mock
      AIVA_GATEWAY_TTS_BACKEND: mock
      AIVA_GATEWAY_EMBED_BACKEND: ${AIVA_GATEWAY_EMBED_BACKEND:-mock}
    ports:
      - "19100:9100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  sandbox-runner:
    build:
      context: ./services/sandbox-runner
    # Required for `unshare --pid --net` (candidate-code isolation, ADR-019)
    # to actually create namespaces. The service process runs as root inside
    # the container regardless (ADR-019, to setuid-drop per execution) — this
    # doesn't broaden that; it's what lets the isolation mechanism the code
    # already assumed was available actually work under Docker's default
    # (deliberately narrow) capability set, which excludes CAP_SYS_ADMIN.
    cap_add:
      - SYS_ADMIN
    ports:
      - "19200:9200"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9200/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ./apps/api
    environment:
      AIVA_DATABASE_URL: postgresql+asyncpg://aiva_app:aiva_app_dev_only@postgres:5432/aiva
      AIVA_ADMIN_DATABASE_URL: postgresql+asyncpg://aiva:aiva_dev_only@postgres:5432/aiva
      AIVA_JWT_SECRET: dev-only-jwt-secret-0123456789abcdef
      # Dev-only, checked-in key (ADR-013's precedent) — override via a real
      # secret at deployment; see .env.example / ADR-025.
      AIVA_ENCRYPTION_KEY: ${AIVA_ENCRYPTION_KEY:-seuo+Ju1ceofY4vl3k+/aGMYyxYQwgrxZpCwFW5HIS0=}
      AIVA_AI_GATEWAY_URL: http://ai-gateway:9100
      AIVA_SANDBOX_URL: http://sandbox-runner:9200
      AIVA_REDIS_URL: redis://redis:6379/0
      AIVA_MINIO_ENDPOINT: minio:9000
      AIVA_MINIO_ACCESS_KEY: aiva_dev
      AIVA_MINIO_SECRET_KEY: aiva_dev_only_change_me
      AIVA_MINIO_BUCKET: aiva-artifacts
      AIVA_MINIO_SECURE: "false"
      AIVA_LOG_LEVEL: INFO
      AIVA_ENVIRONMENT: ${AIVA_ENVIRONMENT:-development}
      # Defaults to logging what would be sent (see app/email.py) -- zero
      # setup, nothing actually delivered. Set AIVA_EMAIL_BACKEND=smtp plus
      # the AIVA_EMAIL_SMTP_* vars in a local .env for real delivery.
      AIVA_EMAIL_BACKEND: ${AIVA_EMAIL_BACKEND:-log}
      AIVA_EMAIL_SMTP_HOST: ${AIVA_EMAIL_SMTP_HOST:-}
      AIVA_EMAIL_SMTP_PORT: ${AIVA_EMAIL_SMTP_PORT:-587}
      AIVA_EMAIL_SMTP_USERNAME: ${AIVA_EMAIL_SMTP_USERNAME:-}
      AIVA_EMAIL_SMTP_PASSWORD: ${AIVA_EMAIL_SMTP_PASSWORD:-}
      AIVA_EMAIL_FROM_ADDR: ${AIVA_EMAIL_FROM_ADDR:-no-reply@aiva.local}
      AIVA_CANDIDATE_PORTAL_URL: ${AIVA_CANDIDATE_PORTAL_URL:-http://localhost:15174}
    ports:
      - "18000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  web-recruiter:
    build:
      context: .
      dockerfile: apps/web-recruiter/Dockerfile
    ports:
      - "15173:80"
    depends_on:
      api:
        condition: service_healthy

  web-candidate:
    build:
      context: .
      dockerfile: apps/web-candidate/Dockerfile
    ports:
      - "15174:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
