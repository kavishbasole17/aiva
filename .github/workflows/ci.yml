name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  no-egress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Egress scan
        run: ./scripts/check_no_egress.sh

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm -r lint
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Build
        run: pnpm -r build

  api-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: Mypy
        run: mypy app
      - name: Bandit
        run: bandit -c pyproject.toml -r app

  gateway-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: Mypy
        run: mypy --strict app
      - name: Bandit
        run: bandit -c pyproject.toml -r app
      - name: Unit tests
        run: pytest

  sandbox-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sandbox-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: Mypy
        run: mypy --strict app
      - name: Bandit
        run: bandit -c pyproject.toml -r app
      - name: Install nodejs for the javascript executor tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nodejs
      - name: Unit tests
        run: pytest

  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up --build --detach
      - name: Wait for readiness
        run: ./scripts/wait_ready.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: pip install -e ".[dev]"
        working-directory: apps/api
      - name: Apply migrations
        working-directory: apps/api
        env:
          AIVA_DATABASE_URL: postgresql+asyncpg://aiva:aiva_dev_only@localhost:15432/aiva
          AIVA_REDIS_URL: redis://localhost:16379/0
          AIVA_MINIO_ENDPOINT: localhost:19000
          AIVA_MINIO_ACCESS_KEY: aiva_dev
          AIVA_MINIO_SECRET_KEY: aiva_dev_only_change_me
          AIVA_MINIO_BUCKET: aiva-artifacts
          AIVA_JWT_SECRET: ci-integration-jwt-secret-0123456789abcdef
          AIVA_ENCRYPTION_KEY: seuo+Ju1ceofY4vl3k+/aGMYyxYQwgrxZpCwFW5HIS0=
        run: alembic upgrade head
      - name: Readiness against live stack
        working-directory: apps/api
        env:
          AIVA_INTEGRATION: "1"
          AIVA_DATABASE_URL: postgresql+asyncpg://aiva_app:aiva_app_dev_only@localhost:15432/aiva
          AIVA_ADMIN_DATABASE_URL: postgresql+asyncpg://aiva:aiva_dev_only@localhost:15432/aiva
          AIVA_JWT_SECRET: ci-integration-jwt-secret-0123456789abcdef
          AIVA_ENCRYPTION_KEY: seuo+Ju1ceofY4vl3k+/aGMYyxYQwgrxZpCwFW5HIS0=
          AIVA_ENVIRONMENT: test
          AIVA_REDIS_URL: redis://localhost:16379/0
          AIVA_MINIO_ENDPOINT: localhost:19000
          AIVA_MINIO_ACCESS_KEY: aiva_dev
          AIVA_MINIO_SECRET_KEY: aiva_dev_only_change_me
          AIVA_MINIO_BUCKET: aiva-artifacts
          AIVA_MINIO_SECURE: "false"
        run: pytest tests/test_integration_readiness.py
      - name: Domain lifecycles against live stack (auth, resume, questionnaire, interview)
        working-directory: apps/api
        env:
          AIVA_INTEGRATION: "1"
          AIVA_DATABASE_URL: postgresql+asyncpg://aiva_app:aiva_app_dev_only@localhost:15432/aiva
          AIVA_ADMIN_DATABASE_URL: postgresql+asyncpg://aiva:aiva_dev_only@localhost:15432/aiva
          AIVA_JWT_SECRET: ci-integration-jwt-secret-0123456789abcdef
          AIVA_ENCRYPTION_KEY: seuo+Ju1ceofY4vl3k+/aGMYyxYQwgrxZpCwFW5HIS0=
          AIVA_ENVIRONMENT: test
          AIVA_REDIS_URL: redis://localhost:16379/0
          AIVA_MINIO_ENDPOINT: localhost:19000
          AIVA_MINIO_ACCESS_KEY: aiva_dev
          AIVA_MINIO_SECRET_KEY: aiva_dev_only_change_me
          AIVA_MINIO_BUCKET: aiva-artifacts
          AIVA_MINIO_SECURE: "false"
          AIVA_AI_GATEWAY_URL: http://localhost:19100
          AIVA_SANDBOX_URL: http://localhost:19200
        run: |
          pytest tests/test_integration_auth.py
          pytest tests/test_integration_resume.py
          pytest tests/test_integration_questionnaire.py
          pytest tests/test_integration_scheduling.py
          pytest tests/test_integration_retention.py
          pytest tests/test_integration_interview.py
          pytest tests/test_integration_workspace.py
          pytest tests/test_integration_faq.py
          pytest tests/test_integration_evaluation.py
          pytest tests/test_integration_m11.py
      - name: Golden-set eval against gateway
        working-directory: packages/eval
        env:
          AIVA_EVAL_GATEWAY_URL: http://localhost:19100
        run: |
          pip install -e ".[dev]"
          pytest tests/test_golden_set.py
      - name: Tear down
        if: always()
        run: docker compose down --volumes
