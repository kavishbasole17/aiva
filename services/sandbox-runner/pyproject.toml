[project]
name = "aiva-sandbox-runner"
version = "0.1.0"
description = "Isolated execution of candidate-submitted code for live coding exercises"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic-settings>=2.6,<3",
    "structlog>=24.4,<25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "httpx>=0.27,<0.28",
    "asgi-lifespan>=2.1,<3",
    "ruff>=0.7,<0.8",
    "black>=24.10,<25",
    "mypy>=1.13,<1.14",
    "bandit>=1.8,<2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests"]
# B404/B603/B607 (subprocess import + partial/dynamic executable path) are
# this module's job: it exists to run subprocesses under strict isolation.
# Argv is always built from a fixed allowlist, never shell-interpreted
# (shell=True is never used).
skips = ["B404", "B603", "B607"]
